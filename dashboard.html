<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warframe Inventory Tracker</title>

    <style>
        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 200px;
            background: #1a1a1a;
            padding: 20px;
            flex-shrink: 0;
            border-right: 1px solid #333;
        }

        .sidebar h1 {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            margin: 4px 0;
            padding: 10px;
        }

        .nav-btn:hover {
            background: #2a2a2a;
        }

        .nav-btn.active {
            background: #2a6df4;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        input {
            width: 200px;
        }

        button {
            background: #2a6df4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1e4db8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #222;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        th {
            cursor: pointer;
            background: #333;
        }

        tr:hover {
            background: #2a2a2a;
        }

        .row-set > td {
            background-color: rgba(58, 110, 165, 0.22);
        }
        .row-set:hover > td {
            background-color: rgba(58, 110, 165, 0.35);
        }

        .row-set > td {
            background-color: rgba(58, 110, 165, 0.22);
            border-top: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;           
        }
        .row-set > td:first-child {
            border-left: 2px solid #ffffff;
        }
        .row-set > td:last-child {
            border-right: 2px solid #ffffff;
        }
        .row-set:hover > td {
            background-color: rgba(58, 110, 165, 0.35);
        }

        .tier-bronze > td { background-color: rgba(139, 90, 43, 0.25); }
        .tier-silver > td { background-color: rgba(140, 154, 168, 0.2); }
        .tier-gold > td { background-color: rgba(234, 196, 53, 0.22); }

        .tier-bronze:hover > td { background-color: rgba(139, 90, 43, 0.4); }
        .tier-silver:hover > td { background-color: rgba(140, 154, 168, 0.35); }
        .tier-gold:hover > td { background-color: rgba(234, 196, 53, 0.37); }

        .mod-common > td { background-color: rgba(139, 90, 43, 0.25); }
        .mod-uncommon > td { background-color: rgba(140, 154, 168, 0.2); }
        .mod-rare > td { background-color: rgba(234, 196, 53, 0.22); }

        .mod-common:hover > td { background-color: rgba(139, 90, 43, 0.4); }
        .mod-uncommon:hover > td { background-color: rgba(140, 154, 168, 0.35); }
        .mod-rare:hover > td { background-color: rgba(234, 196, 53, 0.37); }

        .delete-btn {
            background: #b82a2a;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #8e1f1f;
        }

        .qty-input {
            width: 60px;
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 4px;
            border-radius: 4px;
        }

        #suggestions {
            background:#222;
            border:1px solid #333;
            display:none;
            position:absolute;
            width:200px;
            z-index: 10;
        }

        #suggestions div {
            padding:6px;
            cursor:pointer;
        }

        #suggestions div:hover {
            background:#444;
        }

        .build-tracker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .set-card {
            position: relative;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .set-card-image {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #111;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .set-card h3 {
            margin: 0 0 10px 0;
            cursor: pointer;
        }

        .set-card h3:hover {
            color: #2a6df4;
        }

        .component-checklist {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            flex-grow: 1;
        }

        .component-checklist li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-name {
            cursor: pointer;
            color: inherit;
        }

        .item-name:hover {
            color: #2a6df4;
            font-weight: bold;
            text-decoration: underline;
        }

        .content {
            flex-grow: 1;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
        }

        .view-header {
            position: sticky;
            top: 0;
            background: #111;
            z-index: 15;
            padding-top: 20px;
            padding-bottom: 12px;
            margin-bottom: 12px;
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
            border-bottom: 1px solid #333;
        }

        .relic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .relic-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .relic-card-image {
            width: 100%;
            height: 80px;
            object-fit: contain;
            background: #111;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .relic-card h3 {
            margin: 0 0 8px 0;
            font-size: 0.9em;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .image-container {
            position: relative;
            width: 100%;
        }

        .archwing-badge {
            position: absolute;
            bottom: 17px;
            right: 5px;
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        #farmModal {
            z-index: 9999;
        }

        #priceHistoryModal {
            z-index: 9999;
        }

        #settingsPanel {
            z-index: 9999;
        }

        #relicRewardsModal {
            z-index: 9999;
        }

        .recommendation-set-group {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script> 
</head>

<div id="farmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
    <div style="background:#222; max-width:500px; margin:60px auto; padding:20px; border-radius:6px; max-height:80vh; overflow-y:auto;">
        <button onclick="closeFarmModal()" style="float:right;">Close</button>
        <div id="farmModalBody"></div>
    </div>
</div>

<div id="priceHistoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100;">
    <div style="background:#222; max-width:700px; margin:40px auto; padding:20px; border-radius:6px; max-height:85vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 id="priceHistoryTitle" style="margin:0;"></h2>
            <button onclick="closePriceHistoryModal()">Close</button>
        </div>
        <canvas id="priceHistoryChart" width="650" height="300"></canvas>
        <canvas id="volumeChart" width="650" height="100" style="margin-top:4px;"></canvas>
    </div>
</div>

<body>

    <div class="app-layout">
        <nav class="sidebar" style="display:flex; flex-direction:column;">
            <h1>Warframe Tracker</h1>
            <p id="appVersionDisplay" style="font-size:0.75em; color:#666; margin:-8px 0 12px 0;">v...</p>
                <button class="nav-btn active" data-view="price" onclick="switchView('price')">Price Tracker</button>
                <button class="nav-btn" data-view="build" onclick="switchView('build')">Build Tracker</button>
                <button class="nav-btn" data-view="relics" onclick="switchView('relics')">Relics</button>
                <button id="recommendationsNavBtn" class="nav-btn" data-view="recommendations" onclick="switchView('recommendations')" style="display:none; padding-left:28px; font-size:0.9em;">↳ Recommendations</button>
            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="toggleSettingsPanel()" style="text-align:left;">⚙ Settings</button>
            </div>
        </nav>

        <main class="content">

            <div id="view-price" class="view">
                <div class="view-header">
                    <input id="itemName" placeholder="Item Name" oninput="showSuggestions(this.value)">
                    <div id="suggestions"></div>
                    <input id="itemSlug" type="hidden">
                    <button onclick="addItem()">Add Item</button>
                    <button onclick="updatePrices()">Update Prices</button>

                    <div id="summaryBox" style="margin-top: 8px; font-size: 1.1em;">
                        <div><strong>Total Unique Items:</strong> <span id="totalUnique">0</span></div>
                        <div><strong>Total Platinum Value:</strong> <span id="totalPlat">0</span></div>
                    </div>
                </div>

                <table id="inventoryTable"></table>
            </div>

            <div id="view-build" class="view" style="display:none;">
                <div class="view-header">
                    <h2>Build Tracker</h2>
                    <input id="buildTrackerName" placeholder="Item Name" oninput="showBuildTrackerSuggestions(this.value)">
                    <div id="buildTrackerSuggestions" ...></div>
                    <button onclick="addItemToBuildTracker()">Add to Build Tracker</button>
                    <button onclick="setBuildTrackerFilter('all')">All</button>
                    <button onclick="setBuildTrackerFilter('warframe')">Warframes</button>
                    <button onclick="setBuildTrackerFilter('weapon')">Weapons</button>
                    <button onclick="setBuildTrackerPrimeFilter('all')">Any Rarity</button>
                    <button onclick="setBuildTrackerPrimeFilter('prime')">Prime Only</button>
                    <button onclick="setBuildTrackerPrimeFilter('nonprime')">Non-Prime Only</button>
                </div>

                <table id="buildTrackerTable" style="margin-top: 10px;"></table>
            </div>

            <div id="view-relics" class="view" style="display:none;">
                <div class="view-header">
                    <h2>Relic Inventory</h2>
                    <input id="relicSearchName" placeholder="Relic Name (e.g. Meso N2)" oninput="showRelicSuggestions(this.value)" onkeydown="handleRelicSearchKeydown(event)">
                    <div id="relicSuggestions" style="background:#222; border:1px solid #333; display:none; position:absolute; width:200px; z-index: 10;"></div>
                    <button onclick="addRelicHandler()">Add Relic</button>
                    <button onclick="toggleRecommendationGrouping()">Toggle Grouping</button>
                    <button onclick="loadRecommendations()">Get Recommendations</button>
                </div>

                <div id="relicGrid" class="relic-grid" style="margin-top:16px;"></div>

            </div>

            <div id="view-recommendations" class="view" style="display:none;">
                <div class="view-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0;">Recommendations</h2>
                    <div>
                        <button onclick="setRecommendationTab('gaps')">Tracked Set Gaps</button>
                        <button onclick="setRecommendationTab('discover')">Discover New Sets</button>
                    </div>
                </div>

                <div id="recommendationTabGaps">
                    <div style="margin:12px 0;">
                        <button onclick="toggleRecommendationGrouping()">Toggle Grouping</button>
                        <button onclick="loadRecommendations()">Refresh</button>
                    </div>
                    <div id="recommendationList"></div>
                </div>

                <div id="recommendationTabDiscover" style="display:none;">
                        <div style="margin-bottom:12px;">
                            <button onclick="setDiscoverFilter('all')">All</button>
                            <button onclick="setDiscoverFilter('warframe')">Warframes</button>
                            <button onclick="setDiscoverFilter('weapon')">Weapons</button>
                        </div>
                    <div id="discoverList"></div>
                </div>
            </div>

        </main>
    </div>

    <div id="farmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100;">
        <div style="background:#222; max-width:500px; margin:60px auto; padding:20px; border-radius:6px; max-height:80vh; overflow-y:auto;">
            <button onclick="closeFarmModal()" style="float:right;">Close</button>
            <div id="farmModalBody"></div>
        </div>
    </div>

    <div id="relicRewardsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100;">
        <div style="background:#222; max-width:500px; margin:60px auto; padding:20px; border-radius:6px; max-height:80vh; overflow-y:auto;">
            <button onclick="closeRelicRewardsModal()" style="float:right;">Close</button>
            <div id="relicRewardsBody"></div>
        </div>
    </div> 

    <div id="settingsPanel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100;">
        <div style="background:#222; max-width:500px; margin:60px auto; padding:24px; border-radius:6px; max-height:80vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Settings</h2>
                <button onclick="toggleSettingsPanel()">Close</button>
            </div>

            <div style="margin-bottom:24px;">
                <h3>Data Management</h3>
                <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-start;">
                    <button onclick="exportBackupHandler()" style="background:#444;">Export Backup</button>
                    <button onclick="importBackupHandler()" style="background:#444;">Import Backup</button>
                    <button onclick="restoreAutoBackupHandler()" style="background:#444;">Restore Last Auto-Backup</button>
                    <button onclick="backfillTiersHandler()" style="background:#444;">Recompute Rarity Tiers</button>
                    <button onclick="backfillRelicImagesHandler()" style="background:#444;">Backfill Relic Images</button>
                </div>
            </div>

            <div style="margin-top:20px;">
                <h3>Advanced</h3>
                <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-start;">
                    <button onclick="clearFarmCacheHandler()" style="background:#444;">Clear Farm Data Cache</button>
                    <button onclick="refreshAllRelicDataHandler()" style="background:#444;">Update All Relic Data</button>
                    <p style="font-size:0.8em; color:#888; margin:0;">This can take a moment — it refetches the entire relic drop table.</p>
                </div>
            </div>

        </div>
    </div> 

    <!-- Electron renderer script -->
    <script src="dashboard.js"></script>
</body>
</html>
