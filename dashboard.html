<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warframe Inventory Tracker</title>

    <style>
        .app-layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 200px;
            background: #1a1a1a;
            padding: 20px;
            flex-shrink: 0;
            border-right: 1px solid #333;
        }

        .sidebar h1 {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            margin: 4px 0;
            padding: 10px;
        }

        .nav-btn:hover {
            background: #2a2a2a;
        }

        .nav-btn.active {
            background: #2a6df4;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        body {
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        input {
            width: 200px;
        }

        button {
            background: #2a6df4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1e4db8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #222;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #333;
            text-align: left;
        }

        th {
            cursor: pointer;
            background: #333;
        }

        tr:hover {
            background: #2a2a2a;
        }

        .delete-btn {
            background: #b82a2a;
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #8e1f1f;
        }

        .qty-input {
            width: 60px;
            background: #333;
            color: #eee;
            border: 1px solid #444;
            padding: 4px;
            border-radius: 4px;
        }

        #suggestions {
            background:#222;
            border:1px solid #333;
            display:none;
            position:absolute;
            width:200px;
            z-index: 10;
        }

        #suggestions div {
            padding:6px;
            cursor:pointer;
        }

        #suggestions div:hover {
            background:#444;
        }

        .build-tracker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .set-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .set-card-image {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #111;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .set-card h3 {
            margin: 0 0 10px 0;
            cursor: pointer;
        }

        .set-card h3:hover {
            color: #2a6df4;
        }

        .component-checklist {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            flex-grow: 1;
        }

        .component-checklist li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-name {
            cursor: pointer;
            color: inherit;
        }

        .item-name:hover {
            color: #2a6df4;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script> 
</head>

<div id="farmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
    <div style="background:#222; max-width:500px; margin:60px auto; padding:20px; border-radius:6px; max-height:80vh; overflow-y:auto;">
        <button onclick="closeFarmModal()" style="float:right;">Close</button>
        <div id="farmModalBody"></div>
    </div>
</div>

<div id="priceHistoryModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
    <div style="background:#222; max-width:700px; margin:40px auto; padding:20px; border-radius:6px; max-height:85vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h2 id="priceHistoryTitle" style="margin:0;"></h2>
            <button onclick="closePriceHistoryModal()">Close</button>
        </div>
        <canvas id="priceHistoryChart" width="650" height="300"></canvas>
        <canvas id="volumeChart" width="650" height="100" style="margin-top:4px;"></canvas>
    </div>
</div>

<body>

    <div class="app-layout">
        <nav class="sidebar" style="display:flex; flex-direction:column;">
            <h1>Warframe Tracker</h1>
            <button class="nav-btn active" onclick="switchView('price')">Price Tracker</button>
            <button class="nav-btn" onclick="switchView('build')">Build Tracker</button>

            <div style="margin-top:auto;">
                <button class="nav-btn" onclick="toggleSettingsPanel()" style="text-align:left;">⚙ Settings</button>
            </div>
        </nav>

        <main class="content">

            <div id="view-price" class="view">
                <div>
                    <input id="itemName" placeholder="Item Name" oninput="showSuggestions(this.value)">
                    <div id="suggestions"></div>

                    <input id="itemSlug" placeholder="Slug">

                    <button onclick="addItem()">Add Item</button>
                    <button onclick="updatePrices()">Update Prices</button>
                    <button onclick="exportBackupHandler()">Export Backup</button>
                    <button onclick="importBackupHandler()">Import Backup</button>
                </div>

                <div id="summaryBox" style="margin-left: 20px; font-size: 1.1em;">
                    <div><strong>Total Unique Items:</strong> <span id="totalUnique">0</span></div>
                    <div><strong>Total Platinum Value:</strong> <span id="totalPlat">0</span></div>
                </div>

                <table id="inventoryTable"></table>
            </div>

            <div id="view-build" class="view" style="display:none;">
                <h2>Build Tracker</h2>
                <input id="buildTrackerName" placeholder="Item Name" oninput="showBuildTrackerSuggestions(this.value)">
                <div id="buildTrackerSuggestions" style="background:#222; border:1px solid #333; display:none; position:absolute; width:200px; z-index: 10;"></div>
                <button onclick="addItemToBuildTracker()">Add to Build Tracker</button>

                <table id="buildTrackerTable" style="margin-top: 10px;"></table>
            </div>

        </main>
    </div>

    <div id="farmModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);">
        <div style="background:#222; max-width:500px; margin:60px auto; padding:20px; border-radius:6px; max-height:80vh; overflow-y:auto;">
            <button onclick="closeFarmModal()" style="float:right;">Close</button>
            <div id="farmModalBody"></div>
        </div>
    </div>

    <div id="settingsPanel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85);">
        <div style="background:#222; max-width:500px; margin:60px auto; padding:24px; border-radius:6px; max-height:80vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0;">Settings</h2>
                <button onclick="toggleSettingsPanel()">Close</button>
            </div>

            <div style="margin-bottom:24px;">
                <h3>Data Management</h3>
                <button onclick="restoreAutoBackupHandler()" style="background:#444;">Restore Last Auto-Backup</button>
            </div>
        </div>
    </div> 

    <!-- Electron renderer script -->
    <script src="dashboard.js"></script>
</body>
</html>
